<main class="min-h-[100dvh] bg-[#EEF2EF] flex items-center justify-center sm:p-4">
  <div class="mobile-device-frame bg-white shadow-soft-lg flex flex-col">
    <!-- Subtle mobile status bar on desktop -->
    <header class="hidden sm:flex items-center justify-between px-7 pt-3.5 pb-1 text-xs font-semibold text-[#103A2A]/80 select-none">
      <span>9:41</span>
      <!-- Dynamic island notch -->
      <div class="w-24 h-4 bg-black rounded-full flex items-center justify-end pr-2">
        <span class="w-2 h-2 rounded-full bg-[#1e293b]"></span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-[10px]">5G</span>
        <div class="w-5 h-2.5 border border-[#103A2A]/60 rounded-sm p-[1px] flex items-center">
          <div class="w-full h-full bg-[#103A2A]/70 rounded-[1px]"></div>
        </div>
      </div>
    </header>

    <!-- Main Router Outlet -->
    <div class="flex-1 flex flex-col overflow-y-auto">
      <router-outlet></router-outlet>
    </div>

    <!-- Bottom Home Indicator -->
    <div class="w-full flex justify-center py-2 select-none pointer-events-none">
      <div class="w-32 h-1 bg-[#103A2A]/15 rounded-full"></div>
    </div>
  </div>
</main>
