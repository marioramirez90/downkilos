<div class="loading-screen">
  <div class="loader-content">
    <!-- Spinning Calorie Ring with Leaf Icon -->
    <div class="ring-spinner-wrapper">
      <svg viewBox="0 0 120 120" class="ring-spinner-svg">
        <circle cx="60" cy="60" r="50" class="ring-bg"></circle>
        <circle cx="60" cy="60" r="50" class="ring-accent"></circle>
      </svg>
      <div class="ring-logo-center">
        <img src="images/down-kilos-leaf.png" alt="Down Kilos" class="leaf-icon" />
      </div>
    </div>

    <h2 class="loader-title">Down Kilos</h2>
    <p class="loader-message">{{ loadingMessage }}</p>
  </div>
</div>
