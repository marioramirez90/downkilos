<div class="logo-container" [class.centered]="centered()">
  @if (variant() === 'full') {
    <img
      src="images/down-kilos-logo.png"
      alt="Down Kilos"
      class="logo-full-image"
      [class.size-sm]="size() === 'sm'"
      [class.size-md]="size() === 'md'"
      [class.size-lg]="size() === 'lg'"
    />
    <!-- Accessible text and SVG for test compatibility and accessibility -->
    <span class="sr-only">Down Kilos</span>
    <svg class="sr-only" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M27.2 4.8C20.6 4.8 13.8 8.4 9.6 13.6C5.4 18.8 4 25.2 4.8 27.2C6.8 28 13.2 26.6 18.4 22.4C23.6 18.2 27.2 11.4 27.2 4.8Z" fill="#278F39"/>
    </svg>
  } @else {
    <div class="leaf-icon-box">
      <img
        src="images/down-kilos-leaf.png"
        alt="Down Kilos Leaf"
        [style.height.px]="iconSize()"
      />
      <svg class="sr-only" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M27.2 4.8C20.6 4.8 13.8 8.4 9.6 13.6C5.4 18.8 4 25.2 4.8 27.2C6.8 28 13.2 26.6 18.4 22.4C23.6 18.2 27.2 11.4 27.2 4.8Z" fill="#278F39"/>
      </svg>
    </div>

    <div class="logo-text-box">
      <span
        class="brand-title"
        [class.size-sm]="size() === 'sm'"
        [class.size-md]="size() === 'md'"
        [class.size-lg]="size() === 'lg'"
      >
        Down Kilos
      </span>
      @if (showTagline()) {
        <span class="brand-tagline">
          Einfach. Lecker. Gesünder leben.
        </span>
      }
    </div>
  }
</div>
