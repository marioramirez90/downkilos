<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Down Kilos – Einfach. Lecker. Gesünder Leben.</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#278F39">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Down Kilos">
  <meta name="description" content="Personalisiere deinen Kalorienbedarf, plane gesunde Mahlzeiten und spare beim Einkauf bei Netto Marken-Discount.">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F4F6F4] text-[#17241D] font-sans antialiased selection:bg-[#278F39]/20 selection:text-[#103A2A]">
  <app-root></app-root>

  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        const swUrl = document.querySelector('base') ? new URL('sw.js', document.baseURI).href : 'sw.js';
        navigator.serviceWorker.register(swUrl).then(
          (reg) => console.log('Down Kilos SW registered:', reg.scope),
          (err) => console.warn('Down Kilos SW registration failed:', err)
        );
      });
    }
  </script>
</body>
</html>
